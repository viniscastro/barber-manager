<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dom Barbershop | Clientes</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <nav class="sidebar">
        <a href="index.html" class="logo-link">
            <div class="logo">
                <h2 class="shop-name">💈Dom Barbershop</h2>
                <span class="system-name">Barber Manager</span>
            </div>
        </a>
        <ul class="nav-links">
            <li><a href="index.html">🏠 Início</a></li>
            <li><a href="dashboard.html">📊 Dashboard</a></li>
            <li><a href="agenda.html">📅 Agenda</a></li>
            <li><a href="clientes.html" class="active">👥 Clientes</a></li>
            <li><a href="servicos.html">✂️ Serviços</a></li>
        </ul>
    </nav>

    <main class="main-content">
        <header class="top-header">
            <h1 id="page-title">Clientes</h1>
            <div class="user-profile">
                <span>Bem-vindo, Cassiano</span>
            </div>
        </header>

        <section id="clientes-page" class="active-page">
            <div class="card-lista">
                <div class="agenda-top-bar">
                    <h2>👥 Base de Clientes</h2>
                    <div class="busca-container">
                        <input type="text" id="busca-cliente" placeholder="Procurar por nome ou WhatsApp...">
                    </div>
                </div>

                <table class="tabela-estilizada">
                    <thead>
                        <tr>
                            <th>Nome</th>
                            <th>WhatsApp</th>
                            <th>Última Visita</th>
                            <th>Serviço</th>
                        </tr>
                    </thead>
                    <tbody id="tabela-clientes-body">
                        </tbody>
                </table>
            </div>
        </section>

        <div id="modal-perfil-cliente" class="modal-overlay">
            <div class="modal-content" style="max-width: 450px;">
                <h3 id="perfil-nome-cliente">Nome do Cliente</h3>
                
                <div style="background: var(--bg-body); padding: 20px; border-radius: 10px; margin-bottom: 20px; border: 1px solid var(--border-color);">
                    <p style="margin-bottom: 10px;">📱 <strong>WhatsApp:</strong> <span id="perfil-telefone" style="color: var(--text-muted);"></span></p>
                    <p style="margin-bottom: 10px;">📅 <strong>Última Visita:</strong> <span id="perfil-visita" style="color: var(--text-muted);"></span></p>
                    <p style="margin-bottom: 10px;">✂️ <strong>Serviço Favorito:</strong> <span id="perfil-servico" style="color: var(--text-muted);"></span></p>
                    <p style="font-size: 1.2rem; margin-top: 15px; border-top: 1px solid var(--border-color); padding-top: 15px;">
                        🏆 <strong>Cortes Acumulados:</strong> <span id="perfil-cortes" style="color: var(--primary-color); font-weight: bold;">0</span>
                    </p>
                </div>

                <div class="modal-actions" style="flex-direction: column; gap: 10px;">
                    <button id="btn-resgatar-premio" onclick="zerarCortes()" class="btn-submit" style="background-color: var(--success-color); color: #fff; width: 100%; display: none;">
                        🎁 Resgatar Prêmio (Zerar Cortes)
                    </button>
                    
                    <div style="display: flex; gap: 10px; width: 100%;">
                        <button onclick="fecharPerfilCliente()" class="btn-cancelar" style="flex: 1;">Voltar</button>
                        <button onclick="excluirCliente()" class="btn-remover-servico" style="flex: 1; height: 45px; border-radius: 8px;">Excluir Cadastro</button>
                    </div>
                </div>
            </div>
        </div>

    </main>

    <script src="js/main.js"></script>
</body>
</html>
