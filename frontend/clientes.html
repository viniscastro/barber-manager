<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dom Barbershop | Clientes</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <nav class="sidebar">
        <a href="index.html" class="logo-link">
            <div class="logo">
                <h2 class="shop-name">💈Dom Barbershop</h2>
                <span class="system-name">Barber Manager</span>
            </div>
        </a>
        <ul class="nav-links">
            <li><a href="index.html">🏠 Início</a></li>
            <li><a href="dashboard.html">📊 Dashboard</a></li>
            <li><a href="agenda.html">📅 Agenda</a></li>
            <li><a href="clientes.html" class="active">👥 Clientes</a></li>
            <li><a href="servicos.html">✂️ Serviços</a></li>
        </ul>
    </nav>

    <main class="main-content">
        <header class="top-header">
            <h1 id="page-title">Clientes</h1>
            <div class="user-profile">
                <span>Bem-vindo, Cassiano</span>
            </div>
        </header>

        <section id="clientes-page" class="active-page">
            <div class="card-lista">
                <div class="agenda-top-bar">
                    <h2>👥 Base de Clientes</h2>
                    <div class="busca-container">
                        <input type="text" id="busca-cliente" placeholder="Procurar por nome ou WhatsApp...">
                    </div>
                </div>

                <table class="tabela-estilizada">
                    <thead>
                        <tr>
                            <th>Nome</th>
                            <th>WhatsApp</th>
                            <th>Última Visita</th>
                            <th>Serviço</th>
                        </tr>
                    </thead>
                    <tbody id="tabela-clientes-body">
                        </tbody>
                </table>
            </div>
        </section>
    </main>

    <script src="js/main.js"></script>
</body>
</html>
