<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dom Barbershop | Agenda</title>
    <link rel="icon" type="image/png" href="icon.png?v=2" sizes="32x32">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav class="sidebar">
        <a href="index.html" class="logo-link">
            <div class="logo">
                <h2 class="shop-name">💈Dom Barbershop</h2>
                <span class="system-name">Barber Manager</span>
            </div>
        </a>
        <ul class="nav-links">
            <li><a href="index.html">🏠 Início</a></li>
            <li><a href="dashboard.html">📊 Dashboard</a></li>
            <li><a href="agenda.html" class="active">📅 Agenda</a></li>
            <li><a href="clientes.html">👥 Clientes</a></li>
            <li><a href="servicos.html">✂️ Serviços</a></li>
        </ul>
    </nav>

    <main class="main-content">
        <header class="top-header">
            <h1 id="page-title">Agenda</h1>
            <div class="user-profile"><span>Bem-vindo!</span></div>
        </header>

        <section id="agenda-page" class="active-page">
            <div class="card-lista">
                <div class="agenda-top-bar">
                    <h2>📅 Gestão de Horários</h2>
                    <button id="toggle-agenda-view" class="btn-toggle">Ver Tabela Completa</button>
                </div>

                <div id="agenda-timeline-view">
                    <div class="agenda-navigation">
                        <button id="btn-prev-day" class="btn-toggle btn-small">⬅️</button>
                        <div class="datepicker-container" id="container-datepicker-agenda">
                            <span id="display-data-agenda" class="display-data">Carregando...</span>
                            <input type="text" id="datepicker-agenda" style="display: none;">
                        </div>
                        <button id="btn-next-day" class="btn-toggle btn-small">➡️</button>
                    </div>

                    <div class="timeline" id="daily-timeline"></div>
                </div>

                <div id="agenda-table-view" style="display: none;">
                    <table class="tabela-estilizada">
                        <thead>
                            <tr>
                                <th>Hora</th>
                                <th>Cliente</th>
                                <th>Serviço</th>
                                <th>Cancelar</th>
                            </tr>
                        </thead>
                        <tbody id="tabela-agenda-body"></tbody>
                    </table>
                </div>
            </div>
        </section>

        <div id="modal-confirmacao-agenda" class="modal-overlay">
            <div class="modal-content">
                <h3>Cancelar Agendamento?</h3>
                <p class="modal-text">Tem certeza que deseja cancelar este horário?</p>
                <div class="modal-actions">
                    <button id="btn-cancelar-agenda" class="btn-cancelar">Voltar</button>
                    <button id="btn-confirmar-agenda" class="btn-submit btn-danger">Cancelar</button>
                </div>
            </div>
        </div>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <script src="https://npmcdn.com/flatpickr/dist/l10n/pt.js"></script>
    <script src="js/api.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
