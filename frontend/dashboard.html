<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dom Barbershop | Dashboard</title>
    <link rel="icon" type="image/png" href="icon.png?v=2" sizes="32x32">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <nav class="sidebar">
        <a href="index.html" class="logo-link">
            <div class="logo">
                <h2 class="shop-name">Dom Barbershop</h2>
                <span class="system-name">Barber Manager</span>
            </div>
        </a>
        <ul class="nav-links">
            <li><a href="index.html">Início</a></li>
            <li><a href="dashboard.html" class="active">Dashboard</a></li>
            <li><a href="agenda.html">Agenda</a></li>
            <li><a href="clientes.html">Clientes</a></li>
            <li><a href="servicos.html">Serviços</a></li>
        </ul>
    </nav>

    <main class="main-content">
        <header class="top-header">
            <h1 id="page-title">Visão Geral do Dia</h1>
            
            <div class="welcome-container">
                <p class="welcome-text">Seja bem-vindo(a), <span id="nome-usuario-logado">Utilizador</span></p>
                <button onclick="fazerLogout()" class="btn-logout">Sair</button>
            </div>
            
        </header>

        <section id="dashboard-page" class="active-page">
            <section class="dashboard-cards">
                <div class="card">
                    <h3>Cortes Agendados</h3>
                    <p class="number" id="total-cortes">0</p>
                </div>
                <div class="card">
                    <h3>Próximo Cliente</h3>
                    <p class="next-client">Agenda Livre</p>
                </div>
                <div class="card">
                    <h3>Faturamento Hoje</h3>
                    <p class="number text-success" id="faturamento-hoje">R$ 0,00</p>
                </div>
            </section>
        </section>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <script src="https://npmcdn.com/flatpickr/dist/l10n/pt.js"></script>
    <script src="js/api.js"></script>
    <script src="js/main.js"></script>
    <script src="js/dashboard.js"></script>
</body>
</html>
