version: '3.8'

name: barber-manager-test
services:
  db_servicos:
    image: postgres:15-alpine
    container_name: db_servicos_test
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-password}
      POSTGRES_DB: db_servicos
    ports:
      - "5442:5432" # Porta alterada
    volumes:
      - servicos_test_data:/var/lib/postgresql/data

  servicos-api:
    build: ./backend/servicos
    container_name: servicos_api_test
    restart: always
    ports:
      - "9000:8000" # Porta alterada
    depends_on:
      - db_servicos
      - redis_cache
    environment:
      - DATABASE_URL=postgresql://${DB_USER:-user}:${DB_PASSWORD:-password}@db_servicos:5432/db_servicos
      - REDIS_URL=redis://redis_cache:6379/0 

  db_clientes:
    image: postgres:15-alpine
    container_name: db_clientes_test
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-password}
      POSTGRES_DB: db_clientes
    ports:
      - "5443:5432" # Porta alterada
    volumes:
      - clientes_test_data:/var/lib/postgresql/data

  clientes-api:
    build: ./backend/clientes
    container_name: clientes_api_test
    restart: always
    ports:
      - "9001:8000" # Porta alterada
    depends_on:
      - db_clientes
    environment:
      - DATABASE_URL=postgresql://${DB_USER:-user}:${DB_PASSWORD:-password}@db_clientes:5432/db_clientes

  db_agendamentos:
    image: postgres:15-alpine
    container_name: db_agendamentos_test
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-password}
      POSTGRES_DB: db_agendamentos
    ports:
      - "5444:5432" # Porta alterada
    volumes:
      - agendamentos_test_data:/var/lib/postgresql/data

  agendamentos-api:
    build: ./backend/agendamentos
    container_name: agendamentos_api_test
    restart: always
    ports:
      - "9002:8000" # Porta alterada
    depends_on:
      - db_agendamentos
    environment:
      - DATABASE_URL=postgresql://${DB_USER:-user}:${DB_PASSWORD:-password}@db_agendamentos:5432/db_agendamentos
      
  redis_cache:
    image: redis:alpine
    container_name: redis_cache_test
    restart: always
    ports:
      - "6380:6379" # Porta alterada

  nginx:
    image: nginx:alpine
    container_name: api_gateway_test
    restart: always
    ports:
      - "8080:80" # Porta alterada
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - servicos-api
      - clientes-api
      - agendamentos-api

volumes:
  servicos_test_data:
  clientes_test_data:
  agendamentos_test_data: